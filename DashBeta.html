<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bote inteligente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="diseño.css">
</head>
<body>

<div id="login">
  <div class="marca">
    <div class="logo" data-ico="trash-2" data-size="26"></div>
    <div><h1 id="tituloLogin"></h1><p class="subt">Panel de monitoreo</p></div>
  </div>
  <input id="email" type="email" placeholder="Correo de Particle" autocomplete="username">
  <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
  <input id="devId" type="text" placeholder="Device ID">
  <div id="otpBox" hidden>
    <input id="otp" type="text" inputmode="numeric" placeholder="Código de verificación">
  </div>
  <button id="btnEntrar" class="btn primario">Entrar</button>
  <div id="msg"></div>
</div>

<div id="app" class="app" hidden>
  <header>
    <div class="marca">
      <div class="logo" data-ico="trash-2" data-size="26"></div>
      <div><h1 id="titulo"></h1><p class="subt">Panel de monitoreo</p></div>
    </div>
    <div class="controles">
      <button id="btnAct" class="btn" data-ico="refresh-cw">Actualizar ahora</button>
      <div class="sel"><select id="selMin"></select><span data-ico="chevron-down"></span></div>
      <button id="btnMin" class="btn primario">Aplicar intervalo</button>
      <button id="btnSalir" class="btn borde" data-ico="log-out">Salir</button>
    </div>
  </header>
  <div id="estado">Conectando...</div>
  <div id="aviso" class="aviso" role="alert" hidden>
    <span data-ico="triangle-alert" data-size="20"></span>
    <div><strong>Sin respuesta del sensor</strong> <span id="avisoTxt"></span></div>
  </div>
  <div class="grid" id="grid"></div>
  <section class="card">
    <div class="chart-head">
      <div class="tit"><span data-ico="chart-line" data-size="20"></span>Llenado en las últimas 12 horas</div>
      <div class="leyenda" id="leyenda"></div>
    </div>
    <div class="grafica-scroll"><div id="grafica"></div></div>
  </section>
</div>

<script src="funciones.js"></script>
</body>
</html>
